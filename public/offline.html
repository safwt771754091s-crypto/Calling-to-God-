<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · The True Path Islam</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f2e9;
        color: #1a211d;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 2rem;
      }
      .card {
        max-width: 30rem;
        background: #fffdf8;
        border: 1px solid #e2dac6;
        border-radius: 1rem;
        padding: 2.5rem;
        text-align: center;
        box-shadow: 0 1px 2px rgba(13, 92, 70, 0.06), 0 12px 32px rgba(13, 92, 70, 0.08);
      }
      .mark { width: 3rem; height: 3rem; margin: 0 auto 1.25rem; color: #0d5c46; }
      h1 { font-size: 1.35rem; margin: 0 0 0.5rem; color: #0d5c46; }
      p { margin: 0 0 1.5rem; line-height: 1.6; color: #4a534d; }
      button {
        font: inherit;
        font-weight: 600;
        color: #f2faf5;
        background: #0d5c46;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.7rem 1.5rem;
        cursor: pointer;
      }
      button:hover { background: #0a4a38; }
      .hint { margin-top: 1.25rem; font-size: 0.8rem; color: #8a9188; }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M12 3l8 4v5c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V7l8-4z" />
        <path d="M9 12l2 2 4-4" />
      </svg>
      <h1>You are offline</h1>
      <p>
        The True Path Islam could not reach the network. Pages you have already
        visited are still available; reconnect to load new content.
      </p>
      <button onclick="location.reload()">Try again</button>
      <p class="hint">العربية · 中文 · हिन्दी · 日本語 · Русский · English</p>
    </main>
  </body>
</html>
