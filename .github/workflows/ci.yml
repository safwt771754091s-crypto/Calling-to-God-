name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trupath
          POSTGRES_USER: trupath
          POSTGRES_PASSWORD: trupath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trupath -d trupath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://trupath:trupath@localhost:5432/trupath?schema=public
      AUTH_SECRET: ci-secret
      AUTH_URL: http://localhost:3000
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Ingest Quran content
        run: npm run ingest:quran

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the built app
        run: |
          PORT=3000 npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done
          bash scripts/smoke.sh http://localhost:3000
