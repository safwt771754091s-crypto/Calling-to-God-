name: Security audit

# Scans production dependencies for known vulnerabilities on every push/PR and
# weekly. Fails on high/critical findings in runtime dependencies. The full
# (dev + prod) report is printed for visibility but only --prod gates the build.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit (gate)
        run: npm run ops:security -- --prod --threshold high

      - name: Full dependency audit (report)
        run: npm run ops:security -- --threshold high --warn
