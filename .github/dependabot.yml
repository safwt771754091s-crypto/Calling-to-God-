version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      auth:
        patterns: ["next-auth", "@auth/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
